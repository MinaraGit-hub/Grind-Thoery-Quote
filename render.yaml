services:
  - type: web
    name: grind-quote-app
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
      - key: DATABASE_URL
        fromDatabase:
          name: grind-quote-db
          property: connectionString
      - key: SESSION_SECRET

databases:
  - name: grind-quote-db
    plan: free
