services:
  - type: web
    name: grind-quote-app
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grind-quote-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: grind-quote-db
    plan: free
